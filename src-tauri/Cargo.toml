[package]
name = "amte"
version = "0.1.0"
description = "another minimalist text editor"
authors = ["amte contributors"]
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = "2"

[features]
# Direct Cargo builds are production builds and must embed frontendDist. The
# Tauri CLI disables this default for `tauri dev`, then uses devUrl/Vite.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
ammonia = "4"
gpui = "0.2.2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.2.0"

[[bin]]
name = "amte"
path = "src/main.rs"

[[bin]]
name = "amte-gpui"
path = "src/gpui_boundary.rs"
